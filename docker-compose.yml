# deep-fryer self-hosted stack (SPEC-v3 §2.4): Postgres, MinIO, a one-shot
# migration job, web, worker, and Caddy for TLS — one droplet, no managed
# dependencies. Configure with a .env file next to this one (see
# .env.example), then:
#
#   docker compose up -d --build
#
# Local development without containers for the app: `docker compose up -d db
# minio minio-init` and run web/worker with pnpm.
x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER:-deep_fryer}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-deep_fryer}
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: ${S3_BUCKET:-deep-fryer-evidence}
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-deepfryer}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
  S3_FORCE_PATH_STYLE: 'true'
  S3_PUBLIC_URL: ${APP_URL:?set APP_URL}/files

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deep_fryer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-deep_fryer}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:54322:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-deepfryer}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio:/data
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the evidence bucket with anonymous *read* (snapshots are public
  # records displayed beside each published claim).
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${S3_BUCKET} &&
      mc anonymous set download local/$${S3_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-deepfryer}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-deep-fryer-evidence}

  # Applies SQL migrations, then exits; web and worker wait for it.
  migrate:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app/packages/db
    command: ['node', '--import', 'tsx', 'src/migrate.ts']
    environment:
      MIGRATION_DATABASE_URL: postgres://${POSTGRES_USER:-deep_fryer}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-deep_fryer}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      APP_URL: ${APP_URL:?set APP_URL}
      AUTH_URL: ${APP_URL:?set APP_URL}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      AUTH_MICROSOFT_ENTRA_ID_ID: ${AUTH_MICROSOFT_ENTRA_ID_ID:-}
      AUTH_MICROSOFT_ENTRA_ID_SECRET: ${AUTH_MICROSOFT_ENTRA_ID_SECRET:-}
      AUTH_MICROSOFT_ENTRA_ID_ISSUER: ${AUTH_MICROSOFT_ENTRA_ID_ISSUER:-}
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    expose:
      - '3000'

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      HTTPS_PROXY: ${WORKER_HTTPS_PROXY:-}
      # Run-complete / flagged-finding emails link back to the review queue.
      APP_URL: ${APP_URL:?set APP_URL}
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-}

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - '80:80'
      - '443:443'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS (e.g. app.example.gov)}
      S3_BUCKET: ${S3_BUCKET:-deep-fryer-evidence}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  minio:
  caddy_data:
  caddy_config:
