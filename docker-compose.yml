# deep-fryer self-hosted stack (SPEC-v3 §2.4): Postgres, an S3-compatible
# object store (SeaweedFS), a one-shot migration job, web, worker, and Caddy
# for TLS — one droplet, no managed dependencies. Configure with a .env file
# next to this one (see .env.example), then:
#
#   docker compose up -d --build
#
# Local development without containers for the app: `docker compose up -d db`
# and run web/worker with pnpm (evidence then lands on local disk).
x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER:-deep_fryer}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-deep_fryer}
  S3_ENDPOINT: http://storage:8333
  S3_REGION: us-east-1
  S3_BUCKET: ${S3_BUCKET:-deep-fryer-evidence}
  S3_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:-deepfryer}
  S3_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY}
  S3_FORCE_PATH_STYLE: 'true'
  S3_PUBLIC_URL: ${APP_URL:?set APP_URL}/files
  # Features switched off for the whole deployment (SPEC-v7 §3); web and worker read the same list.
  DF_DISABLED_FEATURES: ${DF_DISABLED_FEATURES:-}

# Sign-in, mail, and billing: the web app's integrations, also given to the
# ops shell (migrate) so scripts/preflight.ts can verify them live.
x-integrations-env: &integrations-env
  APP_URL: ${APP_URL:?set APP_URL}
  AUTH_URL: ${APP_URL:?set APP_URL}
  AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
  AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
  AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
  AUTH_MICROSOFT_ENTRA_ID_ID: ${AUTH_MICROSOFT_ENTRA_ID_ID:-}
  AUTH_MICROSOFT_ENTRA_ID_SECRET: ${AUTH_MICROSOFT_ENTRA_ID_SECRET:-}
  AUTH_MICROSOFT_ENTRA_ID_ISSUER: ${AUTH_MICROSOFT_ENTRA_ID_ISSUER:-}
  SMTP_URL: ${SMTP_URL:-}
  EMAIL_FROM: ${EMAIL_FROM:-}
  SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  # Encrypts organizations' own Anthropic API keys (optional; the worker gets it too).
  DF_SECRETS_KEY: ${DF_SECRETS_KEY:-}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deep_fryer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-deep_fryer}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:54322:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  # Evidence snapshots (the audit record behind every published claim).
  # Credentials and the anonymous-read policy are generated at boot by
  # deploy/storage/start.sh; the S3 port is reachable only on the compose
  # network and from the host's loopback.
  storage:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/deploy/start.sh']
    environment:
      S3_BUCKET: ${S3_BUCKET:-deep-fryer-evidence}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-deepfryer}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY}
    volumes:
      - ./deploy/storage/start.sh:/deploy/start.sh:ro
      - storage:/data
    ports:
      - '127.0.0.1:8333:8333'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8333/healthz']
      interval: 5s
      timeout: 5s
      retries: 30

  # Creates the evidence bucket once (idempotent). Runs inside the storage
  # network with the cluster shell, so the app identity never needs the
  # bucket-admin rights that could also delete it.
  storage-init:
    image: chrislusf/seaweedfs:4.48
    depends_on:
      storage:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -u
        # weed shell exits 1 for "already exists" — that is success here
        # (every `docker compose up` after the first), so judge the output.
        out=$$(echo "s3.bucket.create -name $${S3_BUCKET}" | weed shell -master=storage:9333 2>&1)
        echo "$$out"
        echo "$$out" | grep -qE "created bucket|already exists"
    environment:
      S3_BUCKET: ${S3_BUCKET:-deep-fryer-evidence}

  # Applies SQL migrations, then exits; web and worker wait for it. Also the
  # ops shell (docs/deploy.md §4): `docker compose run --rm migrate node
  # --import tsx ../../scripts/<script>.ts`, so it carries the app's env.
  migrate:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app/packages/db
    command: ['node', '--import', 'tsx', 'src/migrate.ts']
    environment:
      <<: [*app-env, *integrations-env]
      MIGRATION_DATABASE_URL: postgres://${POSTGRES_USER:-deep_fryer}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-deep_fryer}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    environment:
      <<: [*app-env, *integrations-env]
    expose:
      - '3000'

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      # Decrypts organizations' own Anthropic API keys for their sessions (same value as web).
      DF_SECRETS_KEY: ${DF_SECRETS_KEY:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      HTTPS_PROXY: ${WORKER_HTTPS_PROXY:-}
      # Run-complete / flagged-finding emails link back to the review queue.
      APP_URL: ${APP_URL:?set APP_URL}
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-}

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    depends_on:
      - web
      - storage
    ports:
      - '80:80'
      - '443:443'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS (e.g. app.example.gov)}
      S3_BUCKET: ${S3_BUCKET:-deep-fryer-evidence}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
