name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deep_fryer_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      # Stripe's official mock: validates every billing request against
      # Stripe's OpenAPI spec (apps/web/lib/stripe-mock.test.ts).
      stripe-mock:
        image: stripe/stripe-mock:v0.206.0
        ports: ['12111:12111']
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/deep_fryer_ci
      STRIPE_MOCK_URL: http://localhost:12111
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Pinned package manager
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
      - run: pnpm install --frozen-lockfile

      # Migrations must apply cleanly to an empty database every time.
      - name: Migrate (fresh database)
        run: pnpm --filter @deep-fryer/db migrate
      - name: Migrate again (idempotent)
        run: pnpm --filter @deep-fryer/db migrate

      - run: pnpm typecheck
      # Unit tests plus Postgres and stripe-mock integration tests.
      - run: pnpm test
      - name: Stripe setup script against stripe-mock
        env:
          STRIPE_SECRET_KEY: sk_test_123
          STRIPE_API_BASE: http://localhost:12111
        run: |
          node -e "const p=require('./docs/billing/prices.example.json');for(const k in p.prices)p.prices[k]=100;require('fs').writeFileSync('/tmp/prices.json',JSON.stringify(p))"
          pnpm stripe:setup --prices /tmp/prices.json --portal --webhook-url https://ci.example.gov/api/billing/webhook
      - name: Build web (production)
        run: pnpm --filter @deep-fryer/web build

      # Exit 2 (critical) blocks; exit 1 (warnings) is surfaced for review.
      - name: keel verify (architecture + principles)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          pnpm exec keel map --check
          base="$BASE_SHA"
          if [ -z "$base" ] || [ "$base" = '0000000000000000000000000000000000000000' ]; then
            base=$(git rev-parse HEAD^)
          fi
          set +e
          pnpm exec keel verify --diff "$base..HEAD" --json keel-verification.json
          code=$?
          if [ "$code" -gt 1 ]; then exit "$code"; fi
          exit 0
      - name: Retain Keel verification
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: keel-${{ github.sha }}-${{ github.run_attempt }}
          path: keel-verification.json
          if-no-files-found: warn

  pages-build:
    name: Public portrait contracts and browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact_name: ${{ steps.pages-artifact-name.outputs.name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm install --frozen-lockfile
      - name: Validate and build public snapshot
        run: |
          pnpm pages:test
          pnpm pages:build
      - name: Install browser on the CI runner
        run: pnpm --filter @deep-fryer/worker exec playwright-core install --with-deps chromium
      - name: Check all portraits below the Pages prefix
        run: pnpm pages:check
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pages-validation-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            test-results/pages
            test-results/pages-ui
            dist/pages/release.json
          if-no-files-found: warn
      - name: Name this attempt's public artifact
        id: pages-artifact-name
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: echo "name=github-pages-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload the checked public artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: ${{ steps.pages-artifact-name.outputs.name }}
          path: dist/pages

  pages-deploy:
    name: Deploy Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [check, pages-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy validated public artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: ${{ needs.pages-build.outputs.artifact_name }}
